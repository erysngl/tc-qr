<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM Hesaplama</title>
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #212529;
            --muted: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            background-color: #e9ecef;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        .error {
            color: var(--primary);
            font-size: 13px;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .results {
            margin-top: 20px;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
        }

        .result-label {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }

        .result-action {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-value {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }

        .copy-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: #334155;
            transition: all 0.2s;
        }

        .copy-btn:active {
            background-color: var(--primary);
            color: #fff;
        }

        .summary-badge {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            background: #f1f5f9;
            padding: 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="tabs">
        <button class="tab-btn active" id="tabNormal" onclick="setMod('normal')">Normal Vaka</button>
        <button class="tab-btn" id="tabSevk" onclick="setMod('sevk')">İlçe / Sevk Vakası</button>
    </div>

    <div class="form-group">
        <label for="cikisKm">Vakaya Çıkış KM</label>
        <input type="number" id="cikisKm" placeholder="Örn: 100" oninput="hesapla()">
    </div>

    <div class="form-group">
        <label for="donusKm">İstasyona Dönüş KM</label>
        <input type="number" id="donusKm" placeholder="Örn: 241" oninput="hesapla()">
    </div>

    <div id="hataMesaji" class="error">Dönüş KM, çıkış KM'den küçük olamaz.</div>

    <div class="results" id="sonuclar">
        <div class="result-row">
            <span class="result-label" id="lblOlayYeri">Olay Yeri Varış</span>
            <div class="result-action">
                <span class="result-value" id="valOlayYeri">-</span>
                <button class="copy-btn" onclick="kopyala('valOlayYeri', this)">Kopyala</button>
            </div>
        </div>

        <div class="result-row">
            <span class="result-label" id="lblHastane">Hastaneye Varış</span>
            <div class="result-action">
                <span class="result-value" id="valHastane">-</span>
                <button class="copy-btn" onclick="kopyala('valHastane', this)">Kopyala</button>
            </div>
        </div>

        <div class="summary-badge" id="valToplamYol">Toplam Yol: - KM</div>
    </div>
</div>

<script>
    let aktifMod = 'normal';

    function setMod(mod) {
        aktifMod = mod;
        document.getElementById('tabNormal').classList.toggle('active', mod === 'normal');
        document.getElementById('tabSevk').classList.toggle('active', mod === 'sevk');
        
        if (mod === 'normal') {
            document.getElementById('lblOlayYeri').innerText = "Olay Yeri Varış";
            document.getElementById('lblHastane').innerText = "Hastaneye Varış";
        } else {
            document.getElementById('lblOlayYeri').innerText = "Sevk Eden Hastane (1 km)";
            document.getElementById('lblHastane').innerText = "Sevk Edilen Hastane";
        }

        hesapla();
    }

    function hesapla() {
        const cikis = parseFloat(document.getElementById('cikisKm').value);
        const donus = parseFloat(document.getElementById('donusKm').value);
        
        const sonuclar = document.getElementById('sonuclar');
        const hata = document.getElementById('hataMesaji');

        if (isNaN(cikis) || isNaN(donus)) {
            sonuclar.style.display = 'none';
            hata.style.display = 'none';
            return;
        }

        if (donus < cikis) {
            hata.style.display = 'block';
            sonuclar.style.display = 'none';
            return;
        }

        hata.style.display = 'none';
        sonuclar.style.display = 'block';

        const toplamYol = donus - cikis;
        let olayYeri = 0;
        let hastane = 0;

        if (aktifMod === 'normal') {
            // Normal Vaka: Yarı yolda olay yeri, dönüşten 1 km önce hastane
            olayYeri = Math.floor(cikis + (toplamYol / 2));
            hastane = donus - 1;
        } else {
            // Sevk Vakası: Çıkıştan 1 km sonra ilçe hastanesi
            olayYeri = cikis + 1;
            
            // İlçe hastanesinden sonraki kalan yol (gidiş-dönüş sevk)
            const sevkKalanYol = donus - olayYeri;
            // Sevk edilen hastane yarı yolda
            hastane = Math.floor(olayYeri + (sevkKalanYol / 2));
        }

        document.getElementById('valOlayYeri').innerText = olayYeri;
        document.getElementById('valHastane').innerText = hastane;
        document.getElementById('valToplamYol').innerText = "Toplam Kat Edilen: " + toplamYol + " KM";
    }

    function kopyala(elementId, btn) {
        const val = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(val).then(() => {
            const eskiYazi = btn.innerText;
            btn.innerText = "Kopyalandı!";
            setTimeout(() => {
                btn.innerText = eskiYazi;
            }, 1000);
        });
    }
</script>

</body>
</html>
