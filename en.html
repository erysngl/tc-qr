        .poster-story {
            width: 360px;
            height: 640px;
            padding: 46px 20px 52px 20px; /* Üst ve alt Facebook/IG arayüz güvenli boşluğu */
        }
        /* 4:5 Gönderi Boyutu (360x450 -> 3x = 1080x1350 HD) */

            width: 360px;
            min-height: 460px;
            padding: 20px 20px;
        }
        .poster-base {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 45px -15px rgba(0,0,0,0.8);
            border-radius: 12px;
        }

            background: radial-gradient(circle at 80% 10%, #ff2a2a 0%, #c80000 55%, #4a0000 100%);
        }
        .theme-tt {
            background: radial-gradient(circle at 80% 10%, #00c6ff 0%, #00529b 55%, #001a40 100%);
        }
        .theme-mepas {
            background: radial-gradient(circle at 80% 10%, #2563eb 0%, #1e3a8a 55%, #091024 100%);
        }
        .theme-ender {
            background: radial-gradient(circle at 80% 10%, #4f46e5 0%, #1e1b4b 60%, #090d16 100%);
        }
        .glass-box {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
        }
        .center-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1 !important;
            text-align: center;
            vertical-align: middle;

        function setAspectMode(mode) {
            aspectMode = mode;
            const storyBtn = document.getElementById('mode-story');
            const postBtn = document.getElementById('mode-post');
            if (mode === 'story') {
                storyBtn.className = 'bg-cyan-600 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1';
                postBtn.className = 'text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1';
            } else {
                postBtn.className = 'bg-cyan-600 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1';
                storyBtn.className = 'text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1';
            }
            renderPosters();
        }

        function getThemeClass(brand) {
            if (brand === 'Vodafone') return 'theme-vodafone';
            if (brand === 'Türk Telekom') return 'theme-tt';
            if (brand === 'MEPAŞ') return 'theme-mepas';
            return 'theme-ender';
        }

        function getAccentColors(brand) {
            if (brand === 'Vodafone') return { badge: 'bg-white text-red-700', price: 'bg-red-600 text-white', border: 'border-red-100' };
            if (brand === 'Türk Telekom') return { badge: 'bg-cyan-300 text-slate-950', price: 'bg-[#00529b] text-white', border: 'border-sky-100' };
            if (brand === 'MEPAŞ') return { badge: 'bg-amber-400 text-slate-950', price: 'bg-amber-500 text-slate-950', border: 'border-blue-100' };
            return { badge: 'bg-amber-400 text-slate-950', price: 'bg-indigo-600 text-white', border: 'border-indigo-100' };
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentLogoDataUrl = e.target.result;
                document.getElementById('headerLogoPreview').src = currentLogoDataUrl;
                renderPosters();
            };
            reader.readAsDataURL(file);
        }

        function filterPosters(brand) {
            activeFilter = brand;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg transition';
            });
            const activeBtnId = brand === 'ALL' ? 'btn-ALL' : brand === 'Türk Telekom' ? 'btn-TT' : brand === 'Vodafone' ? 'btn-VF' : 'btn-MP';
            document.getElementById(activeBtnId).className = 'filter-btn bg-slate-700 text-white px-2.5 py-1.5 rounded-lg transition';
            renderPosters();
        }

        function renderPosters() {
            const grid = document.getElementById('postersGrid');
            grid.innerHTML = '';

            const filtered = activeFilter === 'ALL' ? campaigns : campaigns.filter(c => c.brand === activeFilter);
            const sizeClass = aspectMode === 'story' ? 'poster-story' : 'poster-post';

            filtered.forEach((camp, index) => {
                const theme = getThemeClass(camp.brand);
                const colors = getAccentColors(camp.brand);
                const isDense = camp.items.length >= 7;
                const isMedium = camp.items.length >= 5 && camp.items.length < 7;

                const rowPad = isDense ? 'py-1 px-2.5' : isMedium ? 'py-1.5 px-3' : 'py-2 px-3';
                const labelSize = isDense ? 'text-[11px]' : 'text-[12px]';
                const subSize = isDense ? 'text-[9px]' : 'text-[10px]';
                const priceBtnSize = isDense ? 'text-[11px] h-6 px-2.5 min-w-[66px]' : 'text-xs h-7 px-3 min-w-[74px]';

                const rowsHtml = camp.items.map(item => `
                    <div class="flex items-center justify-between ${rowPad} rounded-xl bg-slate-50 border ${colors.border}">
                        <div class="pr-2 flex flex-col justify-center">
                            <div class="font-extrabold text-slate-900 ${labelSize} leading-tight">${item.label}</div>
                            <div class="${subSize} font-semibold text-slate-500 leading-tight mt-0.5">${item.sub}</div>
                        </div>
                        <div class="center-pill ${colors.price} font-black ${priceBtnSize} rounded-lg shrink-0 shadow-sm">
                            <span>${item.price}</span>
                        </div>
                    </div>
                `).join('');

                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'flex flex-col items-center gap-2.5';
                cardWrapper.innerHTML = `
                    <!-- POSTER KANVASI -->
                    <div id="poster-${camp.id}" class="poster-base ${sizeClass} ${theme} text-white select-none">
                        <!-- Dekoratif Işık -->
                        <div class="absolute -top-12 -right-12 w-40 h-40 rounded-full bg-white/10 pointer-events-none"></div>

                        <!-- ÜST KURUMSAL BAŞLIK -->
                        <div class="relative z-10 flex items-center justify-between bg-slate-950/50 px-3 py-2 rounded-2xl border border-white/20">
                            <div class="flex items-center gap-2">
                                <img src="${currentLogoDataUrl}" class="w-9 h-9 rounded-full object-cover border-2 border-white bg-slate-900 shrink-0" alt="Logo">
                                <div class="flex flex-col justify-center">
                                    <div class="font-black text-[13px] tracking-wide leading-tight text-white">ENDER İLETİŞİM</div>
                                    <div class="text-[9.5px] font-bold text-white/85 leading-tight mt-0.5">${camp.brand} Yetkili İşlem Merkezi</div>
                                </div>
                            </div>
                            <div class="center-pill h-6 px-2.5 rounded-full bg-white/20 text-white border border-white/30 text-[9px] font-black uppercase tracking-wider shrink-0">
                                <span>${camp.brand}</span>
                            </div>
                        </div>

                        <!-- ORTA KAMPANYA ALANI -->
                        <div class="relative z-10 my-2 flex-1 flex flex-col justify-center">
                            <div class="text-center mb-2 flex flex-col items-center">
                                <div class="center-pill ${colors.badge} text-[9.5px] font-extrabold h-5 px-3 rounded-full shadow mb-1.5">
                                    <span>★ ${camp.badge}</span>
                                </div>
                                <h2 class="font-black ${isDense ? 'text-[14px]' : 'text-[16px]'} leading-snug uppercase tracking-tight drop-shadow px-1">
                                    ${camp.title}
                                </h2>
                                <p class="text-[10px] text-white/90 font-semibold leading-snug mt-0.5 px-2">${camp.subtitle}</p>
                            </div>

                            <!-- Fiyat Listesi Kutusu -->
                            <div class="glass-box rounded-2xl ${isDense ? 'p-2 space-y-1' : 'p-2.5 space-y-1.5'}">
                                ${rowsHtml}
                            </div>
                        </div>

                        <!-- ALT KURUMSAL ŞERİT -->
                        <div class="relative z-10 bg-slate-950/90 border border-white/15 rounded-xl px-3 py-2 flex items-center justify-between">
                            <div class="flex items-center gap-2 pr-1">
                                <img src="${currentLogoDataUrl}" class="w-5 h-5 rounded-full object-cover border border-cyan-400 shrink-0" alt="Logo">
                                <div class="text-[9.5px] font-bold text-slate-200 leading-tight">
                                    ${camp.footer}
                                </div>
                            </div>
                            <div class="center-pill text-[9.5px] font-extrabold text-amber-400 shrink-0">
                                <span>📍 DERİNKUYU</span>
                            </div>
                        </div>
                    </div>

                    <!-- Aksiyon Butonları -->
                    <div class="w-[360px] flex items-center justify-between gap-2 bg-slate-900 border border-slate-800 p-2 rounded-xl">
                        <span class="text-[11px] font-bold text-slate-400 pl-1">#${index + 1} • ${aspectMode === 'story' ? '9:16 Hikaye' : '4:5 Gönderi'}</span>
                        <div class="flex items-center gap-1.5">
                            <button onclick="copyCaption('${camp.id}')" id="copy-${camp.id}" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
                                📋 Metin
                            </button>
                            <button onclick="downloadSinglePoster('${camp.id}', '${camp.brand}')" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-extrabold px-3 py-1.5 rounded-lg transition shadow">
                                ⬇️ PNG İndir
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(cardWrapper);
            });
        }

        function copyCaption(id) {
            const camp = campaigns.find(c => c.id === id);
            if (!camp) return;
            navigator.clipboard.writeText(camp.caption);
            const btn = document.getElementById(`copy-${id}`);
            const oldText = btn.innerHTML;
            btn.innerHTML = '✅ Kopyalandı';
            btn.classList.replace('bg-slate-800', 'bg-emerald-700');
            setTimeout(() => {
                btn.innerHTML = oldText;
                btn.classList.replace('bg-emerald-700', 'bg-slate-800');
            }, 2000);
        }

        async function downloadSinglePoster(id, brand) {
            const el = document.getElementById(`poster-${id}`);
            const status = document.getElementById('statusText');
            status.textContent = `⏳ ${id} (${aspectMode === 'story' ? '1080x1920' : '1080x1350'}) hazırlanıyor...`;

            try {
                await document.fonts.ready;
                const dataUrl = await htmlToImage.toPng(el, {
                    pixelRatio: 3,
                    cacheBust: true
                });

                const link = document.createElement('a');
                const safeBrand = brand.replace(/\s+/g, '_');
                const suffix = aspectMode === 'story' ? 'Hikaye_9x16' : 'Gonderi_4x5';
                link.download = `Ender_Iletisim_${safeBrand}_${suffix}_${id}.png`;
                link.href = dataUrl;
                link.click();
                status.textContent = `✅ ${id} tam ekran uyumlu indirildi!`;
            } catch (err) {
                console.error(err);
                status.textContent = `⚠️ Hata oluştu, tekrar deneyin.`;
            }
        }

        async function downloadAllPosters() {
            const btn = document.getElementById('downloadAllBtn');
            const status = document.getElementById('statusText');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const filtered = activeFilter === 'ALL' ? campaigns : campaigns.filter(c => c.brand === activeFilter);
            for (let i = 0; i < filtered.length; i++) {
                const camp = filtered[i];
                status.textContent = `⏳ İndiriliyor (${i + 1}/${filtered.length}): ${camp.title.substring(0, 22)}...`;
                await downloadSinglePoster(camp.id, camp.brand);
                await new Promise(r => setTimeout(r, 450));
            }

            status.textContent = `🎉 Tüm (${filtered.length}) afişler tam ekran uyumlu indirildi!`;
            btn.disabled = false;
            btn.classList.remove('opacity-50');
        }

        document.getElementById('headerLogoPreview').src = currentLogoDataUrl;
        renderPosters();
    </script>
