<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TC Kimlik -> QR</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230f172a'/%3E%3Crect x='70' y='70' width='110' height='110' rx='16' fill='none' stroke='%2338bdf8' stroke-width='16'/%3E%3Crect x='102' y='102' width='46' height='46' rx='8' fill='%2338bdf8'/%3E%3Crect x='332' y='70' width='110' height='110' rx='16' fill='none' stroke='%2338bdf8' stroke-width='16'/%3E%3Crect x='364' y='102' width='46' height='46' rx='8' fill='%2338bdf8'/%3E%3Crect x='70' y='332' width='110' height='110' rx='16' fill='none' stroke='%2338bdf8' stroke-width='16'/%3E%3Crect x='102' y='364' width='46' height='46' rx='8' fill='%2338bdf8'/%3E%3Crect x='50' y='248' width='412' height='16' rx='8' fill='%232563eb'/%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { 
      background: #0f172a; color: #f8fafc; padding: 75px 16px 36px; 
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
    }

    #status-badge {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 400px; padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(8px);
      border: 1px solid #334155; border-radius: 12px;
      font-size: 14px; font-weight: 700; text-align: center; color: #38bdf8;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); z-index: 1000;
    }

    #install-app-btn {
      display: none; width: 100%; max-width: 400px; padding: 12px; margin-bottom: 12px;
      background: #16a34a; color: #fff; font-size: 14px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer; text-align: center;
    }

    #result-box { 
      width: 100%; max-width: 400px; background: #1e293b; border: 2px solid #4ade80; 
      border-radius: 12px; padding: 16px; margin-bottom: 14px; text-align: center; display: none; 
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    #detected-tc { font-size: 26px; font-weight: 800; letter-spacing: 4px; color: #4ade80; margin-bottom: 10px; }
    #qrcode { display: inline-block; padding: 10px; background: #fff; border-radius: 8px; }

    .camera-wrapper { 
      position: relative; width: 100%; max-width: 400px; height: 380px; border-radius: 14px; 
      overflow: hidden; border: 2px solid #334155; background: #000; 
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Otomatik Tarama Animasyonlu Kılavuz Kutusu */
    .guide-box {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      width: 82%; height: 68px; border: 2px solid #38bdf8; border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); pointer-events: none;
      transition: border-color 0.3s;
    }
    .guide-box.scanning {
      border-color: #fbbf24;
      animation: pulseBorder 1.5s infinite;
    }
    @keyframes pulseBorder {
      0% { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55), 0 0 10px #fbbf24 inset; }
      50% { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55), 0 0 25px #fbbf24 inset; }
      100% { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55), 0 0 10px #fbbf24 inset; }
    }
    
    .guide-hint {
      position: absolute; top: -22px; left: 0; width: 100%; text-align: center;
      font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase;
      letter-spacing: 1px;
    }

    #torch-btn {
      display: none; position: absolute; top: 12px; right: 12px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.75); border: 1px solid #475569;
      color: #f8fafc; font-size: 18px; cursor: pointer; z-index: 20;
      align-items: center; justify-content: center; backdrop-filter: blur(4px);
    }

    #restart-btn { 
      display: none; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 14px 38px; font-size: 16px; font-weight: 700; 
      background: #2563eb; color: #fff; border: 2px solid #60a5fa; border-radius: 30px; 
      cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 10;
    }
    #restart-btn:active { transform: translateX(-50%) scale(0.95); }

    .history-card {
      width: 100%; max-width: 400px; margin-top: 20px; background: #1e293b;
      border: 1px solid #334155; border-radius: 12px; padding: 16px;
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-header h4 { font-size: 15px; color: #cbd5e1; font-weight: 700; }
    .clear-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; cursor: pointer; }
    .history-tc { font-weight: 700; font-size: 15px; color: #38bdf8; letter-spacing: 1px; }
    .history-time { font-size: 12px; color: #64748b; }
    .empty-history { font-size: 13px; color: #64748b; text-align: center; padding: 10px 0; }
    .signature { margin-top: 24px; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #64748b; text-transform: uppercase; }
  </style>
</head>
<body>

  <div id="status-badge">OCR Motoru Hazırlanıyor...</div>
  <button id="install-app-btn">📲 Uygulamayı Telefona Yükle</button>

  <div id="result-box">
    <div id="detected-tc"></div>
    <div id="qrcode"></div>
  </div>

  <div class="camera-wrapper" id="cam-wrapper">
    <video id="camera" autoplay playsinline muted></video>
    <button id="torch-btn" title="Flaş Aç/Kapat">🔦</button>
    <div class="guide-box" id="guide-box">
      <div class="guide-hint">TC Numarasını Buraya Hizalayın</div>
    </div>
    <button id="restart-btn">Yeni Kimlik Tara</button>
  </div>

  <canvas id="snapshot" style="display: none;"></canvas>

  <div class="history-card">
    <div class="history-header">
      <h4>📱 Cihaz İçi Geçmiş</h4>
      <button id="clear-history-btn" class="clear-btn">Temizle</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </div>

  <div class="signature">ERYSNGL</div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-app-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });

    const video = document.getElementById('camera');
    const camWrapper = document.getElementById('cam-wrapper');
    const canvas = document.getElementById('snapshot');
    const restartBtn = document.getElementById('restart-btn');
    const torchBtn = document.getElementById('torch-btn');
    const statusBadge = document.getElementById('status-badge');
    const resultBox = document.getElementById('result-box');
    const detectedTc = document.getElementById('detected-tc');
    const qrContainer = document.getElementById('qrcode');
    const historyList = document.getElementById('history-list');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const guideBox = document.getElementById('guide-box');

    let ocrWorker = null;
    let videoTrack = null;
    let isTorchOn = false;
    let isScanning = false; // Otomatik tarama bayrağı

    // Tesseract'i Başlat
    async function initOCR() {
      try {
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({
          tessedit_char_whitelist: '0123456789',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });
        startCamera();
      } catch (err) {
        statusBadge.textContent = "OCR başlatılamadı.";
      }
    }

    // Kamera Başlat
    function startCamera() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }
      }).then(stream => { 
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.torch) torchBtn.style.display = 'flex';
        
        // Video yüklenince otomatik taramayı başlat
        video.addEventListener('loadeddata', () => {
          startContinuousScan();
        });
      }).catch(() => { 
        statusBadge.textContent = "Kamera izni alınamadı."; 
        statusBadge.style.color = "#f87171";
      });
    }

    torchBtn.addEventListener('click', async () => {
      if (!videoTrack) return;
      isTorchOn = !isTorchOn;
      try {
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        torchBtn.style.background = isTorchOn ? "#fbbf24" : "rgba(15, 23, 42, 0.75)";
        torchBtn.style.color = isTorchOn ? "#000" : "#f8fafc";
      } catch (e) { console.error("Flaş hatası:", e); }
    });

    function tcDogrula(tc) {
      if (!/^[1-9][0-9]{10}$/.test(tc)) return false;
      const d = tc.split('').map(Number);
      const tekler = d[0] + d[2] + d[4] + d[6] + d[8];
      const ciftler = d[1] + d[3] + d[5] + d[7];
      const hane10 = ((tekler * 7) - ciftler) % 10;
      const hane11 = d.slice(0, 10).reduce((a, b) => a + b, 0) % 10;
      return d[9] === ((hane10 + 10) % 10) && d[10] === hane11;
    }

    // Arka Plan Desenlerini Silen Dinamik Eşikleme (Integral Image tabanlı Bradley Yöntemi)
    // Kimlik kartlarındaki desenleri bembeyaz, yazıları simsiyah yapar.
    function applyRobustAdaptiveThreshold(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const d = imgData.data;
      const grays = new Uint8Array(width * height);

      // Gri tonlamaya çevir
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        grays[p] = Math.round(d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
      }

      // İntegral Görüntü
      const intImg = new Uint32Array(width * height);
      for (let y = 0; y < height; y++) {
        let sum = 0;
        for (let x = 0; x < width; x++) {
          sum += grays[y * width + x];
          intImg[y * width + x] = sum + (y > 0 ? intImg[(y - 1) * width + x] : 0);
        }
      }

      const s = Math.max(Math.floor(width / 16), 2); // Pencere boyutu
      const s2 = Math.floor(s / 2);
      const T = 15; // Yüzde 15 daha koyu olan yerleri siyah (metin) yap

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const x1 = Math.max(0, x - s2), x2 = Math.min(width - 1, x + s2);
          const y1 = Math.max(0, y - s2), y2 = Math.min(height - 1, y + s2);
          const count = (x2 - x1) * (y2 - y1);
          
          const sum = intImg[y2 * width + x2] - intImg[y1 * width + x2] - intImg[y2 * width + x1] + intImg[y1 * width + x1];
          const idx = (y * width + x) * 4;
          
          // Eğer piksel çevresinin ortalamasından %15 daha koyu ise siyah, değilse beyaz
          const isText = (grays[y * width + x] * count) < (sum * (100 - T) / 100);
          const val = isText ? 0 : 255;
          
          d[idx] = d[idx+1] = d[idx+2] = val;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // Otomatik Tarama Döngüsü
    async function scanFrame() {
      if (!isScanning || !video.videoWidth) return;

      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const cWidth = camWrapper.clientWidth;
      const cHeight = camWrapper.clientHeight;
      const scale = Math.max(cWidth / vWidth, cHeight / vHeight);
      
      const offsetX = ((vWidth * scale) - cWidth) / 2;
      const offsetY = ((vHeight * scale) - cHeight) / 2;

      const boxW = cWidth * 0.82;
      const boxH = 68;
      const boxX = (cWidth - boxW) / 2;
      const boxY = (cHeight * 0.40) - (boxH / 2);

      const cropX = (boxX + offsetX) / scale;
      const cropY = (boxY + offsetY) / scale;
      const cropW = boxW / scale;
      const cropH = boxH / scale;

      const targetW = cropW * 2; // Daha iyi OCR için 2x büyüt
      const targetH = cropH * 2;
      canvas.width = targetW;
      canvas.height = targetH;
      
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, targetW, targetH);

      // Deseni/arka planı yok et, yazıyı netleştir
      applyRobustAdaptiveThreshold(ctx, targetW, targetH);

      try {
        const { data: { text } } = await ocrWorker.recognize(canvas);
        const digits = text.replace(/[^0-9]/g, '');
        const adaylar = digits.match(/[1-9][0-9]{10}/g) || [];
        const gecerliTc = adaylar.find(tcDogrula);

        if (gecerliTc) {
          // Başarılı Bulma: Taramayı Durdur!
          isScanning = false;
          guideBox.classList.remove('scanning');
          guideBox.style.borderColor = "#4ade80"; // Yeşil Kutu
          
          showQrCode(gecerliTc);
          saveToHistory(gecerliTc);
          
          statusBadge.textContent = "✓ TC Bulundu!";
          statusBadge.style.color = "#4ade80";
          restartBtn.style.display = 'block'; // Yeniden başlat butonunu göster
          return; // Döngüden çık
        }
      } catch (err) {}

      // Bulamadıysa biraz bekleyip tekrar dene (Telefonu ısıtmamak için yarım saniye gecikme)
      if (isScanning) {
        setTimeout(scanFrame, 400);
      }
    }

    function startContinuousScan() {
      isScanning = true;
      resultBox.style.display = 'none';
      restartBtn.style.display = 'none';
      guideBox.classList.add('scanning');
      guideBox.style.borderColor = "#fbbf24";
      statusBadge.textContent = "Kutuyu TC'ye hizalayın. Otomatik aranıyor...";
      statusBadge.style.color = "#fbbf24";
      scanFrame();
    }

    // Yeniden Tara Butonu
    restartBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      startContinuousScan();
    });

    function showQrCode(tc) {
      detectedTc.textContent = tc;
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: tc, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
      resultBox.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem('tc_history_local') || '[]'); } catch { return []; }
    }

    function saveToHistory(tc) {
      let list = getHistory().filter(item => item.tc !== tc);
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      list.unshift({ tc: tc, time: timeStr, timestamp: Date.now() });
      if (list.length > 50) list = list.slice(0, 50);
      localStorage.setItem('tc_history_local', JSON.stringify(list));
      renderHistory();
    }

    function renderHistory() {
      const list = getHistory();
      historyList.innerHTML = '';
      if (list.length === 0) {
        historyList.innerHTML = '<li class="empty-history">Henüz kayıtlı numara yok.</li>';
        return;
      }
      list.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span class="history-tc">${item.tc}</span><span class="history-time">${item.time}</span>`;
        li.addEventListener('click', () => {
          showQrCode(item.tc);
          isScanning = false; // Geçmişten bakarken taramayı durdur
          guideBox.classList.remove('scanning');
          restartBtn.style.display = 'block';
          statusBadge.textContent = "Geçmişten yüklendi!";
          statusBadge.style.color = "#38bdf8";
        });
        historyList.appendChild(li);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm("Geçmiş silinsin mi?")) { localStorage.removeItem('tc_history_local'); renderHistory(); }
    });

    renderHistory();
    initOCR(); // Sayfa yüklenince her şeyi başlatan ana fonksiyon
  </script>
</body>
</html>
