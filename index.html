<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TC Tarayıcı</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:0}
body{background:#0f172a;color:#f8fafc;padding:70px 16px 36px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#badge{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:10px 20px;background:rgba(15,23,42,.92);border:1px solid #334155;border-radius:20px;font-size:13px;font-weight:700;color:#94a3b8;z-index:1000;white-space:nowrap}
#result{width:100%;max-width:400px;background:#1e293b;border:2px solid #10b981;border-radius:16px;padding:20px;margin-bottom:12px;text-align:center;display:none}
#tc{font-size:34px;font-weight:900;letter-spacing:4px;color:#10b981;margin-bottom:14px}
#qr{display:inline-flex;padding:12px;background:#fff;border-radius:12px}
#again{display:none;width:100%;max-width:400px;padding:20px;margin-bottom:12px;font-size:17px;font-weight:800;background:#3b82f6;color:#fff;border:0;border-radius:12px}
.cam{position:relative;width:100%;max-width:400px;height:440px;border-radius:20px;overflow:hidden;border:1px solid #334155;background:#000}
video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:3%;right:3%;top:35%;height:30%;border:2px solid #38bdf8;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,23,42,.55);pointer-events:none}
#dbg{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#cbd5e1;font:600 14px monospace;padding:6px 12px;border-radius:8px;white-space:nowrap}
#sharp{position:absolute;bottom:0;left:0;height:4px;width:0;background:#10b981;transition:width .15s}
#torch{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:22px;display:none;align-items:center;justify-content:center}
.card{width:100%;max-width:400px;margin-top:14px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;padding:12px;font-size:18px;letter-spacing:2px;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:10px}
.manual button{padding:0 16px;font-weight:700;background:#334155;color:#fff;border:0;border-radius:10px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hh h4{font-size:13px;color:#94a3b8;letter-spacing:1px}
.clr{background:transparent;color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600}
ul{list-style:none;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.it{background:#0f172a;padding:12px;border-radius:12px;border:1px solid #334155}
.top{display:flex;justify-content:space-between;align-items:center}
.htc{font-weight:800;font-size:17px;letter-spacing:1px}.hd{font-size:12px;color:#64748b}
.nm{background:none;border:0;color:#38bdf8;font-size:13px;font-weight:600;padding:6px 0 0}.nm.has{color:#10b981}
.empty{font-size:13px;color:#64748b;text-align:center;padding:16px 0}
</style>
</head>
<body>
<div id="badge">Başlatılıyor</div>
<div id="result"><div id="tc"></div><div id="qr"></div></div>
<button id="again">YENİ TARAMA</button>

<div class="cam" id="cam">
  <video id="video" autoplay playsinline muted></video>
  <button id="torch">🔦</button>
  <div class="guide"></div>
  <div id="dbg">Kamera bekleniyor</div>
  <div id="sharp"></div>
</div>

<div class="card manual">
  <input id="man" inputmode="numeric" maxlength="11" placeholder="Elle TC gir">
  <button id="manbtn">QR</button>
</div>

<div class="card">
  <div class="hh"><h4>KAYIT GEÇMİŞİ</h4><button id="clr" class="clr">Temizle</button></div>
  <ul id="hist"></ul>
</div>

<script>
/* ============ AYARLAR ============ */
const CFG = {
  W: 720,          // OCR'a giden şerit genişliği (px). Düşük = hızlı, yüksek = detaylı
  VOTE: 2,         // Aynı TC kaç ayrı karede okunmalı (1 = en hızlı, 2 = güvenli)
  VOTE_MS: 6000,   // Oyların geçerlilik süresi
  WORKERS: 2,      // Paralel OCR işçisi
  CONTRAST: 14     // Yerel eşik farkı (düşük ışıkta düşür, güneşte artır)
};
const BASE = new URL('lib/', location.href).href;
const $ = id => document.getElementById(id);

/* ============ KÜTÜPHANE YÜKLEME (önce yerel, yoksa CDN) ============ */
const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const lib = async (local, cdn) => { try { await load(local); } catch { await load(cdn); } };

let sched = null, track = null, torchOn = false, scanning = false, inflight = 0, peak = 1, votes = new Map(), wake = null;
const c1 = document.createElement('canvas'), x1 = c1.getContext('2d', { willReadFrequently: true });

function status(msg, col) { const b = $('badge'); b.textContent = msg; b.style.color = col || '#94a3b8'; b.style.borderColor = col || '#334155'; }

async function init() {
  try {
    await Promise.all([
      lib(BASE + 'tesseract.min.js', 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'),
      lib(BASE + 'qrcode.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(() => {})
    ]);
    const local = await fetch(BASE + 'eng.traineddata.gz', { method: 'HEAD' }).then(r => r.ok).catch(() => false);
    const opts = local ? { workerPath: BASE + 'worker.min.js', corePath: BASE, langPath: BASE, gzip: true } : {};
    sched = Tesseract.createScheduler();
    for (let i = 0; i < CFG.WORKERS; i++) {
      const w = await Tesseract.createWorker('eng', 1, opts);
      await w.setParameters({
        tessedit_char_whitelist: '0123456789',
        tessedit_pageseg_mode: '11',
        user_defined_dpi: '300'
      });
      sched.addWorker(w);
    }
    startCamera();
  } catch (e) { status('OCR yüklenemedi: lib/ dosyalarını kontrol et', '#ef4444'); }
}

/* ============ KAMERA ============ */
async function startCamera() {
  $('cam').style.display = 'block'; $('result').style.display = 'none'; $('again').style.display = 'none';
  status('Kamera hazırlanıyor');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false
    });
    const v = $('video'); v.srcObject = stream; track = stream.getVideoTracks()[0];
    try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }, { exposureMode: 'continuous' }, { whiteBalanceMode: 'continuous' }] }); } catch {}
    const cap = track.getCapabilities ? track.getCapabilities() : {};
    if (cap.torch) $('torch').style.display = 'flex';
    try { wake = await navigator.wakeLock.request('screen'); } catch {}
    if (v.readyState >= 2) begin(); else v.addEventListener('loadeddata', begin, { once: true });
  } catch { status('Kamera izni yok', '#ef4444'); }
}
function begin() { scanning = true; votes.clear(); peak = 1; status('Tarama aktif', '#38bdf8'); loop(); }
function stopCamera() {
  scanning = false; const v = $('video');
  if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null;
  track = null; torchOn = false; try { wake && wake.release(); } catch {}
  $('cam').style.display = 'none'; $('again').style.display = 'block';
}
document.addEventListener('visibilitychange', async () => { if (!document.hidden && scanning) { try { wake = await navigator.wakeLock.request('screen'); } catch {} } });
$('torch').onclick = async () => {
  if (!track) return; torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch {}
  $('torch').style.background = torchOn ? 'rgba(255,255,255,.9)' : 'rgba(15,23,42,.55)';
};

/* ============ TC DOĞRULAMA ============ */
function tcOk(t) {
  if (!/^[1-9]\d{10}$/.test(t)) return false;
  const d = t.split('').map(Number);
  const h10 = (((d[0] + d[2] + d[4] + d[6] + d[8]) * 7 - (d[1] + d[3] + d[5] + d[7])) % 10 + 10) % 10;
  if (d[9] !== h10) return false;
  return d[10] === d.slice(0, 10).reduce((a, b) => a + b, 0) % 10;
}

/* ============ GÖRÜNTÜ ÖN İŞLEME ============ */
// Kılavuz kutusunu al (video 'cover' ölçeklemesine göre)
function grab() {
  const v = $('video'), vW = v.videoWidth, vH = v.videoHeight, cam = $('cam');
  if (!vW) return null;
  const cw = cam.clientWidth, ch = cam.clientHeight, s = Math.max(cw / vW, ch / vH);
  const bw = cw * 0.94, bh = ch * 0.30, bx = (cw - bw) / 2, by = (ch - bh) / 2;
  const sx = (bx + (vW * s - cw) / 2) / s, sy = (by + (vH * s - ch) / 2) / s, sw = bw / s, sh = bh / s;
  const k = Math.min(1, CFG.W / sw), w = Math.round(sw * k), h = Math.round(sh * k);
  c1.width = w; c1.height = h;
  x1.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
  return x1.getImageData(0, 0, w, h);
}

// 1) Parlaklık = max(R,G,B): renkli guilloche/çiçek desenleri beyazlaşır, siyah yazı kalır
// 2) Netlik ölçümü: titreşimli/bulanık kareleri OCR'a hiç göndermez
// 3) Yerel adaptif eşik (integral görüntü): gölge, parlama, düzensiz ışık
// 4) Otomatik polarite: telefon ekranı (açık yazı/koyu zemin) da düzgün okunur
function prep(img) {
  const { width: w, height: h, data: d } = img, n = w * h, g = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) { const r = d[j], gg = d[j + 1], b = d[j + 2]; g[i] = r > gg ? (r > b ? r : b) : (gg > b ? gg : b); }

  let sh = 0;
  for (let y = 1; y < h - 1; y += 2) for (let x = 1; x < w - 1; x += 2) { const i = y * w + x; sh += Math.abs(g[i + 1] - g[i - 1]) + Math.abs(g[i + w] - g[i - w]); }
  sh /= n / 4;
  peak = Math.max(sh, peak * 0.985);
  const rel = Math.min(1, sh / peak);
  $('sharp').style.width = (rel * 100) + '%';
  if (rel < 0.6) return { blur: true };

  const W1 = w + 1, I = new Uint32Array(W1 * (h + 1));
  for (let y = 1; y <= h; y++) { let row = 0; for (let x = 1; x <= w; x++) { row += g[(y - 1) * w + x - 1]; I[y * W1 + x] = I[(y - 1) * W1 + x] + row; } }
  const r = Math.max(14, h >> 3), T = CFG.CONTRAST, flag = new Uint8Array(n);
  let nd = 0, nl = 0;
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - r), x1_ = Math.min(w, x + r + 1);
      const m = (I[y1 * W1 + x1_] - I[y0 * W1 + x1_] - I[y1 * W1 + x0] + I[y0 * W1 + x0]) / ((x1_ - x0) * (y1 - y0));
      const i = y * w + x;
      if (g[i] < m - T) { flag[i] = 1; nd++; } else if (g[i] > m + T) { flag[i] = 2; nl++; }
    }
  }
  const textFlag = nd >= nl ? 1 : 2, ink = (textFlag === 1 ? nd : nl) / n;
  if (ink < 0.01 || ink > 0.40) return { empty: true };

  const P = 24, c = document.createElement('canvas'); c.width = w + 2 * P; c.height = h + 2 * P;
  const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
  const out = cx.createImageData(w, h), o = out.data;
  for (let i = 0, j = 0; i < n; i++, j += 4) { const v = flag[i] === textFlag ? 0 : 255; o[j] = o[j + 1] = o[j + 2] = v; o[j + 3] = 255; }
  cx.putImageData(out, P, P);
  return { canvas: c };
}

/* ============ TARAMA DÖNGÜSÜ ============ */
function candidates(text) {
  const res = [];
  text.split('\n').forEach(line => {           // satırlar birleştirilmez: yanlış eşleşme azalır
    const s = line.replace(/\D/g, '');
    for (let i = 0; i + 11 <= s.length; i++) { const t = s.substr(i, 11); if (tcOk(t)) res.push(t); }
  });
  return res;
}

function loop() {
  if (!scanning) return;
  if (inflight < CFG.WORKERS) {
    const img = grab(), p = img && prep(img);
    if (p && p.canvas) {
      inflight++;
      sched.addJob('recognize', p.canvas).then(({ data }) => {
        if (!scanning) return;
        const txt = data.text || '', digits = txt.replace(/\D/g, '');
        $('dbg').textContent = digits.length > 2 ? digits.slice(0, 18) : 'Hizalanıyor…';
        const now = Date.now();
        for (const tc of new Set(candidates(txt))) {
          const arr = (votes.get(tc) || []).filter(t => now - t < CFG.VOTE_MS); arr.push(now); votes.set(tc, arr);
          if (arr.length >= CFG.VOTE) { done(tc); return; }
        }
      }).catch(() => {}).finally(() => inflight--);
    } else if (p && p.blur) $('dbg').textContent = 'Net değil – sabit tut';
    else if (p && p.empty) $('dbg').textContent = 'Numarayı kutuya al';
  }
  setTimeout(loop, 50);
}

function done(tc) {
  stopCamera(); show(tc); save(tc); status('✓ Doğrulandı', '#10b981');
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

/* ============ SONUÇ / QR ============ */
function show(tc) {
  $('tc').textContent = tc; $('qr').innerHTML = '';
  if (window.QRCode) new QRCode($('qr'), { text: tc, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M, colorDark: '#000000', colorLight: '#ffffff' });
  $('result').style.display = 'block'; window.scrollTo({ top: 0 });
}
$('again').onclick = () => { window.scrollTo({ top: 0 }); startCamera(); };
$('manbtn').onclick = () => {
  const v = $('man').value.trim();
  if (!tcOk(v)) { status('Geçersiz TC numarası', '#ef4444'); return; }
  stopCamera(); show(v); save(v); status('✓ Elle girildi', '#10b981'); $('man').value = '';
};

/* ============ GEÇMİŞ ============ */
const KEY = 'tc_history_local';
const getH = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
const setH = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch {} };
function save(tc) {
  let l = getH(); const old = l.find(i => i.tc === tc); l = l.filter(i => i.tc !== tc);
  const n = new Date(), p = x => String(x).padStart(2, '0');
  l.unshift({ tc, name: old ? old.name : '', date: `${p(n.getDate())}.${p(n.getMonth() + 1)}.${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}` });
  setH(l.slice(0, 50)); render();
}
function render() {
  const ul = $('hist'); ul.innerHTML = ''; const l = getH();
  if (!l.length) { ul.innerHTML = '<li class="empty">Kayıt yok.</li>'; return; }
  l.forEach(it => {
    const li = document.createElement('li'); li.className = 'it';
    const top = document.createElement('div'); top.className = 'top';
    const a = document.createElement('span'); a.className = 'htc'; a.textContent = it.tc;
    const b = document.createElement('span'); b.className = 'hd'; b.textContent = it.date;
    top.append(a, b); top.onclick = () => { stopCamera(); show(it.tc); status('Geçmiş kaydı'); };
    const nm = document.createElement('button'); nm.className = 'nm' + (it.name ? ' has' : ''); nm.textContent = it.name || 'İsim ekle +';
    nm.onclick = () => {
      const v = prompt(`TC: ${it.tc}\nİsim Soyisim:`, it.name || '');
      if (v !== null) { const L = getH(), k = L.find(i => i.tc === it.tc); if (k) { k.name = v.trim(); setH(L); render(); } }
    };
    li.append(top, nm); ul.appendChild(li);
  });
}
$('clr').onclick = () => { if (confirm('Tüm kayıtlar silinecek. Onaylıyor musunuz?')) { localStorage.removeItem(KEY); render(); } };

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
render(); init();
</script>
</body>
</html>
